{% set name = "metatrain" %}
{% set version = "2026.2.1.dev31" %}
{% set git_rev = "ddda9f9a32ac454d058c7b07a9a370484c473a93" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  git_url: https://github.com/metatensor/metatrain.git
  git_rev: {{ git_rev }}
  depth: 1

build:
  entry_points:
    - mtt = metatrain.__main__:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  string: pyh{{ PKG_HASH }}_git.{{ git_rev[:7] }}_{{ PKG_BUILDNUM }}
  script_env:
    - SETUPTOOLS_SCM_PRETEND_VERSION={{ version }}
  ignore_run_exports:
    - pytorch *  # pytorch is only used as a Python package

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=77
    - setuptools-scm >=8
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - ase
    - huggingface_hub
    - numpy
    - python-metatensor-learn >=0.4.0,<0.5
    - python-metatensor-operations >=0.5.0.rc2,<0.6.0
    - python-metatensor-torch >=0.9.0.rc5,<0.10.0
    - python-metatomic-torch >=0.1.12.rc1,<0.2.0
    - jsonschema
    - pydantic >=2.12
    - typing_extensions
    - omegaconf >=2.3.0
    - python-hostlist
    - tqdm
    - pytorch =2.10.*=cpu*
    - python-vesin >=0.5.2

test:
  imports:
    - metatrain
  commands:
    - pip check
    - mtt --help
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/metatensor/metatrain
  summary: Training and evaluating machine learning models for atomistic systems.
  license: BSD-3-Clause
  license_file: LICENSE
  doc_url: https://metatensor.github.io/metatrain

extra:
  recipe-maintainers:
    - PicoCentauri
    - Luthaf
